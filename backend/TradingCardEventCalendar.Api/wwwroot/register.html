<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Trading Card Event Calendar</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Event Registration</h1>
  </header>

  <main class="page-card">
    <div id="loading">Loading event…</div>
    <div id="error" class="message message-error" hidden></div>

    <div id="register-content" hidden>
      <h2 id="event-name"></h2>
      <dl class="detail-list compact">
        <dt>Game</dt><dd id="event-game"></dd>
        <dt>Start</dt><dd id="event-start"></dd>
        <dt>Spots left</dt><dd id="event-spots"></dd>
      </dl>

      <div id="full-message" class="message message-warning" hidden>
        This event is full. Registration is closed.
      </div>

      <form id="register-form">
        <label for="player-name">Your name</label>
        <input type="text" id="player-name" name="name" required maxlength="100" autocomplete="name">

        <div id="form-error" class="message message-error" hidden></div>
        <div id="form-success" class="message message-success" hidden></div>

        <button type="submit" id="submit-btn" class="btn btn-primary">Register</button>
      </form>
    </div>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
