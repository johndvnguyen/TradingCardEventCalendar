<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Card Event Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Trading Card Event Calendar</h1>
    <button id="schedule-btn" class="btn btn-primary">Schedule Event</button>
  </header>

  <main>
    <div id="calendar"></div>
  </main>

  <dialog id="event-dialog">
    <form id="event-form" method="dialog">
      <h2 id="dialog-title">Schedule Event</h2>

      <label for="event-name">Event Name</label>
      <input type="text" id="event-name" name="name" required maxlength="200">

      <label for="game-type">Game Type</label>
      <select id="game-type" name="gameType" required></select>

      <label for="start-datetime">Start Date &amp; Time</label>
      <input type="datetime-local" id="start-datetime" name="startDatetime" required>

      <label for="player-capacity">Player Capacity</label>
      <input type="number" id="player-capacity" name="playerCapacity" min="1" required>

      <div class="form-actions">
        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="delete-btn" class="btn btn-danger" hidden>Delete</button>
      </div>
    </form>
  </dialog>

  <dialog id="view-dialog">
    <h2 id="view-title"></h2>
    <dl id="view-details"></dl>
    <div class="form-actions">
      <button type="button" id="view-close-btn" class="btn btn-secondary">Close</button>
      <a id="view-event-page-btn" class="btn btn-primary" href="#" target="_blank" rel="noopener">Event page &amp; QR</a>
      <button type="button" id="view-edit-btn" class="btn btn-secondary">Edit</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
